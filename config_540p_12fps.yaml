# 540p @ 12fps Test Configuration
# 2.25x resolution upgrade from 360p
# 9x resolution upgrade from 180p (ultra_fast)
# Target: 10-12 minutes total for 30s video

inputs:
  mascot_image: "assets/fox.png"
  song_file: "assets/song.wav"
  lyrics_file: "assets/lyrics.txt"

output:
  output_dir: "outputs/test_540p"
  video_name: "test_540p.mp4"
  frames_dir: "outputs/test_540p/frames"
  prep_json: "outputs/test_540p/prep_data.json"

video:
  # 540p resolution - 9x more pixels than 180p
  resolution: [960, 540]  # Standard 540p (qHD)

  fps: 12  # Keep same FPS for speed comparison

  render_engine: "EEVEE"  # Fast engine

  samples: 24  # Slight quality bump from 16

  codec: "libx264"
  quality: "medium"  # Medium quality encoding

style:
  lighting: "jazzy"
  mascot: "fox"
  colors:
    primary: [0.8, 0.3, 0.9]
    secondary: [0.3, 0.8, 0.9]
    accent: [0.9, 0.8, 0.3]
  background: "solid"  # Solid color faster than HDRI

animation:
  mode: "2d_grease"  # 2D is faster than 3D

  enable_lipsync: true
  enable_gestures: true
  enable_lyrics: true
  enable_effects: false  # Keep effects disabled for speed

  gesture_intensity: 0.5
  lyrics_style: "bounce"

gp_style:
  stroke_thickness: 4  # Slightly thicker for 540p visibility
  ink_type: "clean"
  enable_wobble: false
  wobble_intensity: 0.0

effects:
  fog:
    enabled: false

  particles:
    enabled: false

  lights:
    spotlight:
      enabled: true
      intensity: 300

    flashes:
      enabled: false

    hdri:
      enabled: false

rhubarb:
  executable_path: null
  use_mock_fallback: true

advanced:
  preview_mode: true
  preview_scale: 1.0
  keep_intermediate: false  # Don't keep frames to save space
  verbose: true
  threads: null
  debug_mode: false  # Set to true if you want positioning markers

blender:
  executable_path: null
  background: true
  script_path: "blender_script.py"
