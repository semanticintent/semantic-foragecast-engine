inputs:
  mascot_image: demo_reel/assets/demo_fox.png
  song_file: demo_reel/assets/demo_song.wav
  lyrics_file: demo_reel/assets/demo_lyrics.txt
output:
  output_dir: demo_reel/3d_billboard_test
  video_name: 3d_billboard_test.mp4
  frames_dir: demo_reel/3d_billboard_test/frames
  prep_json: demo_reel/3d_billboard_test/prep_data.json
video:
  duration: 1
  resolution:
  - 720
  - 480
  fps: 24
  render_engine: EEVEE
  samples: 32
  codec: libx264
  quality: high
style:
  lighting: jazzy
  mascot: fox
  stage: true
  colors:
    primary:
    - 0.95
    - 0.4
    - 0.2
    secondary:
    - 0.2
    - 0.6
    - 0.9
    accent:
    - 0.95
    - 0.85
    - 0.3
  background: gradient
animation:
  mode: 3d
  enable_lipsync: true
  enable_gestures: true
  enable_lyrics: true
  enable_effects: true
  gesture_intensity: 0.8
  lyrics_style: bounce
effects:
  lights:
    spotlight:
      enabled: true
      intensity: 800
      color:
      - 1.0
      - 0.95
      - 0.9
    flashes:
      enabled: true
      intensity_range:
      - 10
      - 20
      random_colors: true
materials:
  mascot:
    type: pbr
    roughness: 0.3
    metallic: 0.0
    specular: 0.5
  stage:
    type: pbr
    color:
    - 0.15
    - 0.15
    - 0.18
    roughness: 0.7
    metallic: 0.0
rhubarb:
  executable_path: null
  use_mock_fallback: true
advanced:
  preview_mode: false
  preview_scale: 1.0
  keep_intermediate: true
  verbose: true
  threads: null
blender:
  executable_path: "C:/Program Files/Blender Foundation/Blender 4.0/blender.exe"
  background: true
  script_path: blender_script.py
