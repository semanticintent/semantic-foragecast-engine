gp_style:
  stroke_thickness: 4
  ink_type: sketchy
  enable_wobble: true
  wobble_intensity: 0.6
inputs:
  mascot_image: demo_reel/assets/demo_fox.png
  song_file: demo_reel/assets/demo_song.wav
  lyrics_file: demo_reel/assets/demo_lyrics.txt
output:
  output_dir: demo_reel/3d
  video_name: 3d_demo.mp4
  frames_dir: demo_reel/3d/frames
  prep_json: demo_reel/3d/prep_data.json
video:
  duration: 10
  resolution:
  - 1920
  - 1080
  fps: 24
  render_engine: EEVEE
  samples: 64
  codec: libx264
  quality: high
style:
  lighting: jazzy
  mascot: fox
  colors:
    primary:
    - 0.9
    - 0.2
    - 0.7
    secondary:
    - 0.2
    - 0.9
    - 0.9
    accent:
    - 0.9
    - 0.9
    - 0.2
  background: gradient
animation:
  mode: 3d
  enable_lipsync: true
  enable_gestures: true
  enable_lyrics: true
  enable_effects: true
  gesture_intensity: 0.8
  lyrics_style: bounce
effects:
  fog:
    enabled: true
    density: 0.03
  particles:
    enabled: true
    count: 500
    type: sparks
  lights:
    spotlight:
      enabled: true
      intensity: 800
      color:
      - 1.0
      - 0.95
      - 0.9
    flashes:
      enabled: true
      intensity_range:
      - 10
      - 20
      random_colors: true
rhubarb:
  executable_path: null
  use_mock_fallback: true
advanced:
  preview_mode: false
  preview_scale: 1.0
  keep_intermediate: true
  verbose: true
  threads: null
blender:
  executable_path: null
  background: true
  script_path: blender_script.py
