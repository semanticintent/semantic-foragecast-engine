[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-foragecast-engine"
version = "1.0.0"
description = "Audio-driven mascot animation pipeline: beat detection, lip-sync, sprite compositing, video export"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Semantic Intent", email = "info@semanticintent.com"}
]
maintainers = [
    {name = "Semantic Intent", email = "info@semanticintent.com"}
]
keywords = [
    "animation",
    "mascot",
    "audio-analysis",
    "video-generation",
    "lip-sync",
    "sprite-animation",
    "music-visualization",
    "automated-video",
    "beat-detection",
    "rhubarb"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
requires-python = ">=3.9"
dependencies = [
    "librosa>=0.10.1",
    "pydub>=0.25.1",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0"
]

[project.optional-dependencies]
lyrics = [
    "openai-whisper>=20230314",
    "torch>=2.0.0"
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
    "pre-commit>=3.3.3"
]
all = [
    "semantic-foragecast-engine[lyrics,dev]"
]

[project.urls]
Homepage = "https://github.com/semanticintent/semantic-foragecast-engine"
Documentation = "https://github.com/semanticintent/semantic-foragecast-engine#documentation"
Repository = "https://github.com/semanticintent/semantic-foragecast-engine"
Issues = "https://github.com/semanticintent/semantic-foragecast-engine/issues"
Changelog = "https://github.com/semanticintent/semantic-foragecast-engine/blob/main/CHANGELOG.md"

[project.scripts]
semantic-foragecast = "main:main"

[tool.setuptools]
py_modules = ["main", "prep_audio", "export_video", "compose_animation", "generate_sprites"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | outputs
  | demo_reel
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "ffmpeg: marks tests that require FFmpeg"
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
exclude = [
    "outputs/",
    "demo_reel/",
    "build/",
    "dist/"
]

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring
    "R0913",  # Too many arguments
    "R0914",  # Too many local variables
]

[tool.bandit]
exclude_dirs = ["tests/", "outputs/", "demo_reel/"]
skips = ["B101", "B601"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "outputs/*",
    "demo_reel/*",
    "assets/*",
    "*/__pycache__/*",
    "*/venv/*",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]
