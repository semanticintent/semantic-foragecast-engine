name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests — Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run Phase 1 unit tests
      run: pytest tests/test_prep_audio.py -v --cov=prep_audio --cov-report=xml

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests

  e2e-tests:
    name: E2E Tests — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run E2E suite
      run: python tests/test_e2e_pipeline.py

  compositor-tests:
    name: Compositor Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run compositor + sprite generator tests
      run: |
        pytest tests/test_compose_animation.py tests/test_generate_sprites.py -v --cov=compose_animation --cov-report=xml
      continue-on-error: true  # remove once tests exist

  video-export-tests:
    name: Video Export Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Install FFmpeg
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Run video export tests
      run: pytest tests/test_export_video.py -v

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linters
      run: pip install flake8 black isort

    - name: flake8 (errors only)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

    - name: black (check)
      run: black --check --line-length=100 *.py
      continue-on-error: true

    - name: isort (check)
      run: isort --check-only --profile=black *.py
      continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt bandit

    - name: Run bandit
      run: bandit -r . -f json -o bandit-report.json || true
      continue-on-error: true

    - name: Upload security report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, compositor-tests, video-export-tests, code-quality, security-scan]
    if: always()

    steps:
    - name: Report
      run: |
        echo "=== CI Summary — Semantic Foragecast Engine ==="
        echo "Unit Tests:         ${{ needs.unit-tests.result }}"
        echo "E2E Tests:          ${{ needs.e2e-tests.result }}"
        echo "Compositor Tests:   ${{ needs.compositor-tests.result }}"
        echo "Video Export Tests: ${{ needs.video-export-tests.result }}"
        echo "Code Quality:       ${{ needs.code-quality.result }}"
        echo "Security Scan:      ${{ needs.security-scan.result }}"

        if [ "${{ needs.unit-tests.result }}" != "success" ]; then
          echo "Unit tests failed"; exit 1
        fi
        if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
          echo "E2E tests failed"; exit 1
        fi
        echo "All critical tests passed."
